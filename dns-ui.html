<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
  :root {
    --bg: #0a0b10;
    --gold: #f5b700;
    --gold-light: #ffe082;
    --emerald: #10e870;
    --primary: #9b87f5;
    --muted: #9aa3b8;
  }
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }
  body {
    margin: 0;
    min-height: 100vh;
    padding: 16px 16px 120px;
    background: var(--bg);
    color: #fff;
    font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
    display: flex;
    flex-direction: column;
  }
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 24px;
  }
  .title { font-size: 20px; font-weight: 800; margin: 0; }
  .subtitle { font-size: 12px; color: var(--gold-light); margin-top: 3px; }
  .pill-btn {
    border-radius: 999px;
    padding: 6px 13px;
    font-size: 12px;
    font-weight: 700;
    border: 1px solid var(--primary);
    background: rgba(155,135,245,0.18);
    color: #fff;
    white-space: nowrap;
    cursor: pointer;
  }

  .center-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .update-card {
    position: relative;
    width: 100%;
    max-width: 400px;
    overflow: hidden;
    border-radius: 26px;
    padding: 26px 20px 22px;
    background: linear-gradient(145deg, #1d170e 0%, #11131d 55%, #090a0f 100%);
    border: 1.3px solid rgba(245,183,0,0.68);
    box-shadow: 0 16px 40px rgba(0,0,0,0.55);
    text-align: center;
  }
  .update-card::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 85% 12%, rgba(245,183,0,0.22), transparent 55%),
      radial-gradient(circle at 15% 90%, rgba(155,135,245,0.12), transparent 50%);
    pointer-events: none;
  }
  .update-card::after {
    content: "";
    position: absolute;
    top: 0; left: 14%; right: 14%; height: 1.5px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.42), transparent);
    pointer-events: none;
  }

  .card-inner {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 5px 12px;
    border-radius: 999px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.6px;
    color: var(--gold-light);
    background: rgba(245,183,0,0.14);
    border: 1px solid rgba(245,183,0,0.48);
  }
  .pulse-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 0 0 rgba(245,183,0,0.7);
    animation: pulse 1.8s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(245,183,0,0.75); }
    70% { box-shadow: 0 0 0 8px rgba(245,183,0,0); }
    100% { box-shadow: 0 0 0 0 rgba(245,183,0,0); }
  }

  .icon-ring {
    width: 68px;
    height: 68px;
    border-radius: 22px;
    background: linear-gradient(135deg, rgba(245,183,0,0.26), rgba(20,17,11,0.9));
    border: 1.2px solid rgba(245,183,0,0.72);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 2px;
  }
  .spin-svg {
    animation: spin 3.2s linear infinite;
  }
  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  .card-title {
    font-size: 17.5px;
    font-weight: 900;
    color: #fff;
    margin: 2px 0 0;
  }
  .card-desc {
    font-size: 13px;
    line-height: 1.85;
    color: var(--muted);
    margin: 0;
    max-width: 310px;
  }

  .btn-stack {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 9px;
    margin-top: 6px;
  }
  .btn-gold {
    width: 100%;
    padding: 12px;
    border-radius: 14px;
    border: none;
    font-size: 13px;
    font-weight: 900;
    color: #140e00;
    background: linear-gradient(90deg, #ffe699, #f5b700, #d98a00);
    cursor: pointer;
  }
  .btn-gold:active { transform: scale(0.985); }
  .btn-outline {
    width: 100%;
    padding: 11px;
    border-radius: 14px;
    font-size: 12.5px;
    font-weight: 800;
    color: var(--gold-light);
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(245,183,0,0.45);
    cursor: pointer;
  }
  .btn-outline:active { transform: scale(0.985); }
</style>
</head>
<body>

<div class="header">
  <div>
    <h1 class="title">DNS Server</h1>
    <div class="subtitle">بروزرسانی و بهینه‌سازی سرورها</div>
  </div>
  <div id="headerAction"></div>
</div>

<div class="center-wrap">
  <div class="update-card">
    <div class="card-inner">
      <span class="status-pill">
        <span class="pulse-dot"></span>
        UPDATING SERVERS
      </span>

      <div class="icon-ring">
        <svg class="spin-svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#ffe082" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 1 1-2.64-6.36"/>
          <polyline points="21 3 21 9 15 9"/>
        </svg>
      </div>

      <h2 class="card-title">سرورها در حال آپدیت هستند</h2>
      <p class="card-desc">
        لطفاً چند دقیقه بعد مجدداً تلاش کنید.<br>
        در حال ارتقا و بهینه‌سازی مسیرها برای پینگ پایدارتر هستیم.
      </p>

      <div class="btn-stack">
        <button class="btn-gold" onclick="reloadPage()">↻ بررسی مجدد</button>
        <button class="btn-outline" onclick="openTelegram()">اطلاع‌رسانی در کانال تلگرام</button>
      </div>
    </div>
  </div>
</div>

<script>
const TELEGRAM_URL = "https://t.me/Balochping_ir";

function native() { return window.BPNative || null; }

window.onNativeState = function(raw) {
  try {
    const st = (typeof raw === "string") ? JSON.parse(raw) : raw;
    const ha = document.getElementById("headerAction");
    if (st && st.activeId) {
      ha.innerHTML = '<button class="pill-btn" onclick="native()&&native().disconnect()">قطع اتصال</button>';
    } else {
      ha.innerHTML = "";
    }
  } catch (e) {}
};

function reloadPage() {
  if (native() && native().retrySync) native().retrySync();
  location.reload();
}

function openTelegram() {
  if (native() && native().openUrl) {
    native().openUrl(TELEGRAM_URL);
  } else {
    location.href = TELEGRAM_URL;
  }
}

if (native() && native().getState) {
  window.onNativeState(native().getState());
}
</script>
</body>
</html>
