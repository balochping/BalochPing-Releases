<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
  :root {
    --bg: #0a0b10;
    --card: #131520;
    --vip-card: #14121b;
    --gold: #f5b700;
    --gold-light: #ffe082;
    --emerald: #10e870;
    --cyan: #00e5ff;
    --danger: #ff5252;
    --primary: #9b87f5;
    --muted: #8b93a7;
    --border: rgba(255,255,255,0.08);
  }
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }
  body {
    margin: 0;
    padding: 12px 16px 135px;
    background: var(--bg);
    color: #fff;
    font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
  }
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 12px;
  }
  .title { font-size: 20px; font-weight: 800; margin: 0; }
  .subtitle { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .subtitle.vip-active { color: var(--emerald); }
  .subtitle.vip-idle { color: var(--gold-light); }
  .subtitle.err { color: var(--danger); }
  .pill-btn {
    border-radius: 999px;
    padding: 6px 13px;
    font-size: 12px;
    font-weight: 700;
    border: 1px solid var(--primary);
    background: rgba(155,135,245,0.18);
    color: #fff;
    white-space: nowrap;
    cursor: pointer;
  }
  .tabs {
    display: flex;
    gap: 6px;
    padding: 4px;
    border-radius: 16px;
    background: #0e0f15;
    border: 1px solid #232634;
    margin-bottom: 12px;
  }
  .tab {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 9px 6px;
    border-radius: 12px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--muted);
    border: 1px solid transparent;
    cursor: pointer;
  }
  .tab.free-on {
    background: rgba(155,135,245,0.18);
    border-color: rgba(155,135,245,0.65);
    color: #fff;
  }
  .tab.vip-on {
    background: rgba(245,183,0,0.18);
    border-color: rgba(245,183,0,0.75);
    color: #fff;
  }
  .tab.vip-on.active {
    background: rgba(16,232,112,0.18);
    border-color: rgba(16,232,112,0.75);
  }

  /* کارت VIP لوکس */
  .vip-hero {
    position: relative;
    overflow: hidden;
    border-radius: 24px;
    padding: 16px;
    margin-bottom: 12px;
    background: linear-gradient(135deg, #1f170d 0%, #11131c 52%, #08090d 100%);
    border: 1.3px solid rgba(245,183,0,0.78);
    box-shadow: 0 10px 28px rgba(0,0,0,0.45);
  }
  .vip-hero::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 88% 15%, rgba(245,183,0,0.22), transparent 56%),
      radial-gradient(circle at 14% 82%, rgba(16,232,112,0.10), transparent 46%);
    pointer-events: none;
  }
  .vip-hero::after {
    content: "";
    position: absolute;
    top: 0; left: 12%; right: 12%; height: 1.5px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.38), transparent);
    pointer-events: none;
  }
  .vip-inner { position: relative; z-index: 1; display: flex; flex-direction: column; gap: 13px; }
  .row-between { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .row { display: flex; align-items: center; gap: 8px; }
  .crown-box {
    width: 44px; height: 44px; border-radius: 14px;
    background: linear-gradient(135deg, rgba(245,183,0,0.32), #1a1408);
    border: 1px solid rgba(245,183,0,0.75);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .pass-tag { font-size: 10.5px; font-weight: 900; color: var(--gold-light); letter-spacing: 0.9px; }
  .hero-title { font-size: 15px; font-weight: 800; color: #fff; margin-top: 2px; }
  .badge-gold {
    padding: 4px 10px; border-radius: 999px; font-size: 10.5px; font-weight: 800;
    color: var(--gold-light); background: rgba(245,183,0,0.14); border: 1px solid rgba(245,183,0,0.5);
    white-space: nowrap;
  }
  .badge-active {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 999px; font-size: 10px; font-weight: 900; letter-spacing: 0.8px;
    color: var(--emerald); background: rgba(16,232,112,0.14); border: 1px solid rgba(16,232,112,0.55);
  }
  .dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
  .chips { display: flex; gap: 6px; }
  .chip {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 5px;
    padding: 6px 5px; border-radius: 10px; font-size: 10px; font-weight: 700; color: #e2e8f0;
    background: rgba(0,0,0,0.36); border: 1px solid rgba(255,255,255,0.12);
    white-space: nowrap;
  }
  .btn-row { display: flex; gap: 8px; }
  .btn-gold {
    flex: 1.1; display: flex; align-items: center; justify-content: center; gap: 6px;
    padding: 11px 10px; border-radius: 14px; border: none; font-size: 12.5px; font-weight: 900;
    color: #140e00; background: linear-gradient(90deg, #ffe699, #f5b700, #d98a00);
    cursor: pointer;
  }
  .btn-outline-gold {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
    padding: 10px; border-radius: 14px; font-size: 12.5px; font-weight: 800;
    color: var(--gold-light); background: rgba(255,255,255,0.06); border: 1.1px solid rgba(245,183,0,0.65);
    cursor: pointer;
  }
  .btn-danger {
    padding: 9px 14px; border-radius: 13px; font-size: 12px; font-weight: 700;
    color: #ff8a8a; background: rgba(255,82,82,0.10); border: 1px solid rgba(255,82,82,0.35);
    cursor: pointer;
  }
  .gauge-wrap { position: relative; width: 74px; height: 74px; flex-shrink: 0; }
  .gauge-text {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  .gauge-num { font-size: 21px; font-weight: 900; line-height: 22px; }
  .gauge-lbl { font-size: 9.5px; font-weight: 700; color: var(--gold-light); }
  .serial-bar {
    display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap;
    padding: 4px 8px; border-radius: 8px; font-family: monospace; font-size: 10.5px; font-weight: 700;
    background: rgba(0,0,0,0.45); border: 1px solid rgba(255,255,255,0.1); color: var(--gold-light);
    margin: 5px 0;
  }
  .mini-tag {
    display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 9.5px; font-weight: 700;
    background: rgba(245,183,0,0.14); border: 1px solid rgba(245,183,0,0.45); color: var(--gold-light);
  }
  .mini-tag.gray { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.16); color: #e2e8f0; }

  /* کارت سرورها */
  .list { display: flex; flex-direction: column; gap: 10px; }
  .srv-card {
    display: flex; align-items: center; gap: 12px;
    padding: 12px; border-radius: 18px;
    background: var(--card); border: 1px solid var(--border);
    cursor: pointer; transition: transform .08s ease;
  }
  .srv-card:active { transform: scale(0.985); }
  .srv-card.vip { background: var(--vip-card); border-color: rgba(245,183,0,0.38); }
  .srv-card.vip.unlocked { border-color: rgba(245,183,0,0.68); }
  .srv-card.connected { background: rgba(155,135,245,0.18); border: 1.5px solid var(--primary); }
  .srv-card.vip.connected { background: #0e241c; border: 1.5px solid var(--emerald); }

  .thumb {
    position: relative; width: 92px; height: 54px; border-radius: 12px; overflow: hidden;
    background: #1a1d29; border: 1.2px solid rgba(255,255,255,0.2); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb-badge {
    position: absolute; top: 4px; right: 4px;
    padding: 2px 5px; border-radius: 6px; font-size: 8.5px; font-weight: 900;
    background: rgba(0,0,0,0.82);
  }
  .thumb-badge.free { color: var(--emerald); border: 1px solid rgba(16,232,112,0.8); }
  .thumb-badge.vip { color: var(--gold-light); border: 1px solid rgba(245,183,0,0.8); }

  .srv-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .srv-pill {
    align-self: flex-start; display: inline-flex; align-items: center; gap: 5px;
    padding: 2px 8px; border-radius: 999px; font-size: 10px; font-weight: 800; letter-spacing: 0.4px;
    background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12); color: #cbd5e1;
  }
  .srv-card.vip .srv-pill { background: rgba(245,183,0,0.14); border-color: rgba(245,183,0,0.45); color: var(--gold-light); }
  .srv-card.connected .srv-pill { background: rgba(155,135,245,0.2); border-color: var(--primary); color: var(--primary); }
  .srv-card.vip.connected .srv-pill { background: rgba(16,232,112,0.16); border-color: var(--emerald); color: var(--emerald); }

  .srv-name { font-size: 14px; font-weight: 800; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .srv-sub { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .srv-card.connected .srv-sub { color: var(--primary); }
  .srv-card.vip.connected .srv-sub { color: var(--emerald); }

  .status-icon {
    width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .status-icon.ring { width: 22px; height: 22px; border: 1.5px solid #64748b; }
  .status-icon.ring.vip { border-color: rgba(245,183,0,0.7); }
  .status-icon.lock { background: rgba(245,183,0,0.16); border: 1px solid rgba(245,183,0,0.65); color: var(--gold-light); }
  .status-icon.check { background: var(--primary); color: #0a0b10; }
  .status-icon.check.vip { background: var(--emerald); color: #04140b; }

  /* پنجره ورود کد VIP */
  .modal-bg {
    position: fixed; inset: 0; z-index: 999;
    background: rgba(0,0,0,0.74); backdrop-filter: blur(4px);
    display: none; align-items: center; justify-content: center; padding: 18px;
  }
  .modal-bg.open { display: flex; }
  .modal {
    width: 100%; max-width: 390px; border-radius: 24px; padding: 18px;
    background: linear-gradient(180deg, #1a1626, #0b0c11);
    border: 1.5px solid var(--gold);
    display: flex; flex-direction: column; gap: 13px;
  }
  .code-input {
    width: 100%; padding: 14px; border-radius: 14px; text-align: center;
    background: #07080c; border: 1.3px solid rgba(245,183,0,0.65);
    color: var(--gold-light); font-family: monospace; font-size: 16px; font-weight: 800; letter-spacing: 1.5px;
    outline: none; user-select: text; -webkit-user-select: text;
  }
  .err-box {
    padding: 8px 10px; border-radius: 10px; font-size: 11.5px; font-weight: 600;
    background: rgba(255,82,82,0.14); border: 1px solid rgba(255,82,82,0.5); color: #ff8a8a;
  }
  .btn-activate {
    width: 100%; padding: 12px; border-radius: 14px; border: none;
    font-size: 13px; font-weight: 900; color: #04140b;
    background: linear-gradient(90deg, #10e870, #00c853); cursor: pointer;
  }
  .btn-activate:disabled { background: #262a36; color: #7b8396; }
  .notice { font-size: 11px; color: #ff8a8a; font-weight: 600; }
</style>
</head>
<body>

<div class="header">
  <div>
    <h1 class="title">DNS Server</h1>
    <div id="subtitle" class="subtitle">در حال بارگذاری...</div>
  </div>
  <div id="headerAction"></div>
</div>

<div class="tabs">
  <div id="tabFree" class="tab free-on" onclick="setTab(false)">رایگان (3)</div>
  <div id="tabVip" class="tab" onclick="setTab(true)">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M3 17l1-10 5 4 3-7 3 7 5-4 1 10H3zm1 2h16v2H4v-2z"/></svg>
    <span id="tabVipTxt">سرورهای VIP</span>
  </div>
</div>

<div id="vipBannerSlot"></div>
<div id="serverList" class="list"></div>

<div id="vipModal" class="modal-bg" onclick="if(event.target===this) closeModal()">
  <div class="modal">
    <div class="row-between">
      <div class="row">
        <div class="crown-box" style="width:38px;height:38px;border-radius:11px">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="#ffe082"><path d="M3 17l1-10 5 4 3-7 3 7 5-4 1 10H3zm1 2h16v2H4v-2z"/></svg>
        </div>
        <div>
          <div style="font-size:15.5px;font-weight:800">فعال‌سازی اشتراک VIP</div>
          <div style="font-size:11px;color:#ffe082">تک‌کاربره • تایید آنلاین و فوری</div>
        </div>
      </div>
      <div onclick="closeModal()" style="width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:center;cursor:pointer">✕</div>
    </div>
    <div style="font-size:12px;color:#b3bacb;line-height:1.6">
      پس از خرید اشتراک، کد اختصاصی دریافت‌شده را در کادر زیر وارد کنید تا تمام سرورهای VIP بلافاصله برای شما باز شوند.
    </div>
    <input id="codeInput" class="code-input" dir="ltr" placeholder="مثال: BP-8492-X7" maxlength="32"
      oninput="this.value=this.value.toUpperCase().replace(/\s+/g,''); updateModalBtn()">
    <div id="modalErr" class="err-box" style="display:none"></div>
    <button id="activateBtn" class="btn-activate" onclick="submitVipCode()">فعال‌سازی و باز کردن سرورهای VIP</button>
    <button class="btn-outline-gold" style="width:100%" onclick="openBuy()">⚡ هنوز کد ندارید؟ خرید اشتراک از تلگرام</button>
  </div>
</div>

<script>
// === تنظیمات سریع (هر تغییری اینجا بدهی بدون بیلد روی همه گوشی‌ها اعمال می‌شود) ===
const CONFIG = {
  TELEGRAM_URL: "https://t.me/Balochping_ir",
  FREE_SERVERS: [
    { id: "free_tr", title: "TURKIYE", sub: "سرور رایگان ترکیه • اتصال پایدار", tag: "FREE ROUTE", accent: "#e30a17", flag: "https://flagcdn.com/w160/tr.png", emoji: "🇹🇷" },
    { id: "free_ae", title: "UAE",     sub: "سرور رایگان امارات • خاورمیانه",  tag: "FREE ROUTE", accent: "#10e870", flag: "https://flagcdn.com/w160/ae.png", emoji: "🇦🇪" },
    { id: "free_de", title: "GERMANY", sub: "سرور رایگان آلمان • سرور اروپا",   tag: "FREE ROUTE", accent: "#f5b700", flag: "https://flagcdn.com/w160/de.png", emoji: "🇩🇪" }
  ],
  VIP_SERVERS: [
    { id: "vip_tr_1", title: "TURKIYE 1", sub: "PRIMARY GAMING ROUTE", tag: "VIP TURBO",    accent: "#e30a17", flag: "https://flagcdn.com/w160/tr.png", emoji: "🇹🇷" },
    { id: "vip_tr_2", title: "TURKIYE 2", sub: "ALTERNATE ROUTE",      tag: "STABLE ROUTE", accent: "#e30a17", flag: "https://flagcdn.com/w160/tr.png", emoji: "🇹🇷" },
    { id: "vip_de_1", title: "GERMANY 1", sub: "EUROPE GATEWAY",       tag: "PRO ROUTE",    accent: "#f5b700", flag: "https://flagcdn.com/w160/de.png", emoji: "🇩🇪" },
    { id: "vip_ae_1", title: "UAE 1",     sub: "MIDDLE EAST CORE",     tag: "LOW PING",     accent: "#10e870", flag: "https://flagcdn.com/w160/ae.png", emoji: "🇦🇪" },
    { id: "vip_ae_2", title: "UAE 2",     sub: "BACKUP GATEWAY",       tag: "DIRECT ROUTE", accent: "#00e5ff", flag: "https://flagcdn.com/w160/ae.png", emoji: "🇦🇪" },
    { id: "vip_qa_1", title: "QATAR 1",   sub: "GULF CONNECT",         tag: "FAST ROUTE",   accent: "#8a1538", flag: "https://flagcdn.com/w160/qa.png", emoji: "🇶🇦" },
    { id: "vip_bh_1", title: "BAHRAIN 1", sub: "GULF EDGE",            tag: "ESPORTS",      accent: "#ef4444", flag: "https://flagcdn.com/w160/bh.png", emoji: "🇧🇭" }
  ]
};

let selectedVipTab = false;
let modalOpen = false;
let appState = {
  activeId: null, isSyncing: false, syncFailed: false,
  isVerifyingVip: false, isActivating: false,
  vipNotice: "", vipError: "", savedCode: "",
  vip: { active: false, codeMasked: "", daysLeft: 0, expiresAt: "", serverIds: [] }
};

function native() { return window.BPNative || null; }

window.onNativeState = function(raw) {
  try {
    const next = (typeof raw === "string") ? JSON.parse(raw) : raw;
    const wasActive = appState.vip && appState.vip.active;
    appState = next;
    if (!wasActive && appState.vip && appState.vip.active && modalOpen) {
      modalOpen = false;
      selectedVipTab = true;
      document.getElementById("vipModal").classList.remove("open");
    }
    render();
  } catch (e) {}
};

function setTab(isVip) { selectedVipTab = isVip; render(); }

function openModal() {
  modalOpen = true;
  const inp = document.getElementById("codeInput");
  if (!inp.value && appState.savedCode) inp.value = appState.savedCode;
  document.getElementById("vipModal").classList.add("open");
  if (native() && native().clearVipError) native().clearVipError();
  updateModalBtn();
}

function closeModal() {
  if (appState.isActivating) return;
  modalOpen = false;
  document.getElementById("vipModal").classList.remove("open");
}

function updateModalBtn() {
  const btn = document.getElementById("activateBtn");
  const val = document.getElementById("codeInput").value.trim();
  btn.disabled = !val || appState.isActivating;
  btn.textContent = appState.isActivating ? "در حال بررسی آنلاین..." : "فعال‌سازی و باز کردن سرورهای VIP";
}

function submitVipCode() {
  const val = document.getElementById("codeInput").value.trim();
  if (!val || appState.isActivating) return;
  if (native()) native().activateVip(val);
}

function openBuy() {
  if (native()) native().openUrl(CONFIG.TELEGRAM_URL);
}

function clickServer(id, title, isVip) {
  if (isVip && !(appState.vip && appState.vip.active)) { openModal(); return; }
  if (appState.activeId === id) {
    if (native()) native().disconnect();
  } else {
    if (native()) native().connect(id, title, isVip);
  }
}

function render() {
  const vipOn = !!(appState.vip && appState.vip.active);
  const sub = document.getElementById("subtitle");
  sub.className = "subtitle";
  if (appState.isSyncing && !selectedVipTab) {
    sub.textContent = "در حال دریافت سرورهای رمزنگاری‌شده...";
  } else if (appState.syncFailed && !selectedVipTab) {
    sub.textContent = "خطا در ارتباط با سرور • اینترنت را بررسی کنید";
    sub.classList.add("err");
  } else if (selectedVipTab && vipOn) {
    sub.textContent = "اشتراک VIP فعال • " + appState.vip.daysLeft + " روز باقی‌مانده • نامحدود";
    sub.classList.add("vip-active");
  } else if (selectedVipTab) {
    sub.textContent = CONFIG.VIP_SERVERS.length + " سرور اختصاصی VIP • حجم نامحدود";
    sub.classList.add("vip-idle");
  } else {
    sub.textContent = CONFIG.FREE_SERVERS.length + " سرور رایگان • ترکیه، امارات و آلمان";
  }

  const ha = document.getElementById("headerAction");
  if (appState.activeId) {
    ha.innerHTML = '<button class="pill-btn" onclick="native()&&native().disconnect()">قطع اتصال</button>';
  } else if (appState.syncFailed) {
    ha.innerHTML = '<button class="pill-btn" onclick="native()&&native().retrySync()">تلاش مجدد</button>';
  } else {
    ha.innerHTML = "";
  }

  const tFree = document.getElementById("tabFree");
  const tVip = document.getElementById("tabVip");
  tFree.textContent = "رایگان (" + CONFIG.FREE_SERVERS.length + ")";
  tFree.className = "tab" + (!selectedVipTab ? " free-on" : "");
  tVip.className = "tab" + (selectedVipTab ? (" vip-on" + (vipOn ? " active" : "")) : "");
  document.getElementById("tabVipTxt").textContent = vipOn ? ("VIP فعال (" + CONFIG.VIP_SERVERS.length + ")") : "سرورهای VIP";

  const banner = document.getElementById("vipBannerSlot");
  if (!selectedVipTab) {
    banner.innerHTML = "";
  } else if (vipOn) {
    const days = Math.max(0, appState.vip.daysLeft || 0);
    const pct = Math.max(0.08, Math.min(1, days / 30));
    const dash = 188.5;
    const off = dash * (1 - pct);
    banner.innerHTML =
      '<div class="vip-hero"><div class="vip-inner">' +
        '<div class="row-between">' +
          '<span class="badge-active"><span class="dot" style="background:#10e870"></span>ACTIVE</span>' +
          '<span class="pass-tag">BALOCH PING • PRO PASS 👑</span>' +
        '</div>' +
        '<div class="row" style="gap:14px">' +
          '<div class="gauge-wrap">' +
            '<svg width="74" height="74" viewBox="0 0 74 74">' +
              '<circle cx="37" cy="37" r="30" fill="none" stroke="rgba(255,255,255,0.09)" stroke-width="5.5"/>' +
              '<circle cx="37" cy="37" r="30" fill="none" stroke="url(#gGrad)" stroke-width="5.5" stroke-linecap="round" stroke-dasharray="' + dash + '" stroke-dashoffset="' + off + '" transform="rotate(-90 37 37)"/>' +
              '<defs><linearGradient id="gGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ffe082"/><stop offset="60%" stop-color="#f5b700"/><stop offset="100%" stop-color="#10e870"/></linearGradient></defs>' +
            '</svg>' +
            '<div class="gauge-text"><span class="gauge-num">' + days + '</span><span class="gauge-lbl">روز مانده</span></div>' +
          '</div>' +
          '<div style="flex:1;min-width:0">' +
            '<div style="font-size:16px;font-weight:800">اشتراک VIP نامحدود</div>' +
            '<div class="serial-bar" dir="ltr">ID ' + (appState.vip.codeMasked || "") + (appState.vip.expiresAt ? (" • EXP " + appState.vip.expiresAt) : "") + '</div>' +
            '<div class="row" style="gap:6px;flex-wrap:wrap">' +
              '<span class="mini-tag">∞ حجم نامحدود</span>' +
              '<span class="mini-tag gray">' + CONFIG.VIP_SERVERS.length + ' سرور اختصاصی</span>' +
            '</div>' +
          '</div>' +
        '</div>' +
        '<div class="btn-row">' +
          '<button class="btn-outline-gold" onclick="native()&&native().refreshVip()">↻ بروزرسانی سرورها</button>' +
          (days <= 5 ? '<button class="btn-gold" style="flex:0.5" onclick="openBuy()">تمدید</button>' : '') +
          '<button class="btn-danger" onclick="native()&&native().logoutVip()">خروج</button>' +
        '</div>' +
      '</div></div>';
  } else {
    banner.innerHTML =
      '<div class="vip-hero"><div class="vip-inner">' +
        '<div class="row-between">' +
          '<div class="row" style="gap:10px">' +
            '<div class="crown-box"><svg width="22" height="22" viewBox="0 0 24 24" fill="#ffe082"><path d="M3 17l1-10 5 4 3-7 3 7 5-4 1 10H3zm1 2h16v2H4v-2z"/></svg></div>' +
            '<div><div class="pass-tag">PRO GAMING PASS</div><div class="hero-title">سرورهای اختصاصی و کم‌پینگ VIP</div></div>' +
          '</div>' +
          '<span class="badge-gold">۱ کاربره</span>' +
        '</div>' +
        '<div class="chips">' +
          '<div class="chip"><span class="dot" style="background:#f5b700"></span>حجم نامحدود</div>' +
          '<div class="chip"><span class="dot" style="background:#10e870"></span>پینگ اختصاصی</div>' +
          '<div class="chip"><span class="dot" style="background:#00e5ff"></span>تک‌کاربره</div>' +
        '</div>' +
        (appState.vipNotice ? '<div class="notice">' + appState.vipNotice + '</div>' : '') +
        '<div class="btn-row">' +
          '<button class="btn-gold" onclick="openBuy()">⚡ خرید اشتراک</button>' +
          '<button class="btn-outline-gold" onclick="openModal()">🔑 ورود به حساب</button>' +
        '</div>' +
      '</div></div>';
  }

  const listEl = document.getElementById("serverList");
  const items = selectedVipTab ? CONFIG.VIP_SERVERS : CONFIG.FREE_SERVERS;
  listEl.innerHTML = items.map(function(s) {
    const isVip = selectedVipTab;
    const locked = isVip && !vipOn;
    const connected = !locked && appState.activeId === s.id;
    const cls = "srv-card" + (isVip ? " vip" : "") + (isVip && !locked ? " unlocked" : "") + (connected ? " connected" : "");
    const badgeCls = isVip ? "vip" : "free";
    const badgeTxt = isVip ? "VIP" : "FREE";
    const iconHtml = locked
      ? '<div class="status-icon lock">🔒</div>'
      : connected
        ? '<div class="status-icon check' + (isVip ? ' vip' : '') + '">✓</div>'
        : '<div class="status-icon ring' + (isVip ? ' vip' : '') + '"></div>';

    return (
      '<div class="' + cls + '" onclick="clickServer(\'' + s.id + '\',\'' + s.title + '\',' + isVip + ')">' +
        '<div class="thumb" style="border-color:' + (connected ? (isVip ? '#10e870' : '#9b87f5') : (isVip ? 'rgba(245,183,0,0.75)' : s.accent)) + '">' +
          '<img src="' + s.flag + '" alt="' + s.title + '" onerror="this.style.display=\'none\'">' +
          '<span class="thumb-badge ' + badgeCls + '">' + badgeTxt + '</span>' +
        '</div>' +
        '<div class="srv-info">' +
          '<span class="srv-pill"><span class="dot" style="background:' + (connected ? (isVip ? '#10e870' : '#9b87f5') : (isVip ? '#f5b700' : s.accent)) + '"></span>' + (connected ? 'CONNECTED' : s.tag) + '</span>' +
          '<div class="srv-name">' + s.title + '</div>' +
          '<div class="srv-sub">' + (connected ? 'متصل به دی‌ان‌اس • برای قطع بزن' : s.sub) + '</div>' +
        '</div>' +
        iconHtml +
      '</div>'
    );
  }).join("");

  const errEl = document.getElementById("modalErr");
  if (appState.vipError) {
    errEl.textContent = appState.vipError;
    errEl.style.display = "block";
  } else {
    errEl.style.display = "none";
  }
  updateModalBtn();
}

render();
if (native() && native().getState) {
  window.onNativeState(native().getState());
}
</script>
</body>
</html>
