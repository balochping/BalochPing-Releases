admin-ui.html

<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>مدیریت VIP بلوچ پینگ</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  background: #0a0b10;
  color: #fff;
  font-family: system-ui, Tahoma, sans-serif;
  padding: 14px 14px 44px;
}

.head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
  gap: 10px;
}

.head-title {
  font-size: 17px;
  font-weight: 900;
}

.head-sub {
  font-size: 11px;
  color: #8b93a7;
  margin-top: 2px;
}

.refresh-btn {
  width: auto;
  margin: 0;
  padding: 7px 12px;
  border-radius: 10px;
  background: #1a1e2e;
  color: #ffe082;
  border: 1px solid rgba(245,183,0,.45);
  font-size: 12px;
  font-weight: 800;
  cursor: pointer;
}

.stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin-bottom: 12px;
}

.stat {
  background: #141622;
  border: 1px solid #262a3d;
  border-radius: 14px;
  padding: 10px 5px;
  text-align: center;
  cursor: pointer;
}

.stat .num {
  font-size: 18px;
  font-weight: 900;
  line-height: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
}

.stat .lbl {
  font-size: 10px;
  color: #9aa3b8;
  margin-top: 4px;
  font-weight: 700;
}

.stat.online .num { color: #10e870; }
.stat.active .num { color: #00e5ff; }
.stat.ready .num { color: #ffe082; }
.stat.expired .num { color: #ff7b7b; }

.stat.selected {
  background: #1c1f30;
  border-color: #f5b700;
}

.stat.online.selected { border-color: #10e870; }
.stat.active.selected { border-color: #00e5ff; }

.pulse {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #10e870;
  box-shadow: 0 0 0 0 rgba(16,232,112,.75);
  animation: pulse 1.8s infinite;
  display: inline-block;
}

@keyframes pulse {
  0% { box-shadow: 0 0 0 0 rgba(16,232,112,.75); }
  70% { box-shadow: 0 0 0 7px rgba(16,232,112,0); }
  100% { box-shadow: 0 0 0 0 rgba(16,232,112,0); }
}

.card {
  background: #141622;
  border: 1px solid #2b2f45;
  border-radius: 16px;
  padding: 14px;
  margin-bottom: 12px;
}

h2 {
  margin: 0 0 11px;
  color: #f5b700;
  font-size: 15.5px;
  font-weight: 800;
}

input, select, button {
  width: 100%;
  padding: 11px 12px;
  border-radius: 11px;
  border: 1px solid #333852;
  background: #0b0c12;
  color: #fff;
  font-size: 13.5px;
  margin-bottom: 9px;
  outline: none;
}

input:focus, select:focus {
  border-color: #f5b700;
}

button {
  background: linear-gradient(90deg,#ffe082,#f5b700);
  color: #140e00;
  font-weight: 900;
  border: none;
  cursor: pointer;
}

button:disabled {
  opacity: .6;
  cursor: not-allowed;
}

.filter-bar {
  display: flex;
  gap: 6px;
  margin-bottom: 10px;
  overflow-x: auto;
}

.f-pill {
  width: auto;
  margin: 0;
  padding: 6px 12px;
  border-radius: 999px;
  font-size: 11.5px;
  font-weight: 700;
  background: #141622;
  color: #9aa3b8;
  border: 1px solid #262a3d;
  white-space: nowrap;
}

.f-pill.on {
  background: rgba(245,183,0,.16);
  color: #ffe082;
  border-color: #f5b700;
}

.search-wrap {
  position: relative;
  margin-bottom: 12px;
}

.search-input {
  margin-bottom: 0;
  padding: 11px 14px 11px 38px;
  background: #141622;
  border: 1px solid #2b2f45;
  border-radius: 13px;
}

.search-clear {
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: #262a3d;
  color: #cbd5e1;
  font-size: 12px;
  display: none;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  border: none;
  padding: 0;
  margin: 0;
}

.row {
  display: flex;
  gap: 8px;
}

.btn-sm {
  padding: 8px 10px;
  font-size: 12px;
  border-radius: 9px;
  margin: 0;
  font-weight: 700;
}

.btn-gray {
  background: #23273a;
  color: #fff;
}

.btn-red {
  background: #3b161c;
  color: #ff7b7b;
}

.btn-green {
  background: #113626;
  color: #10e870;
}

.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}

.code-wrap {
  display: flex;
  align-items: center;
  gap: 7px;
  flex-wrap: wrap;
}

.code {
  font-family: monospace;
  font-size: 15.5px;
  color: #ffe082;
  font-weight: 800;
  letter-spacing: 1px;
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 10px;
  font-weight: 800;
  padding: 2px 8px;
  border-radius: 999px;
}

.b-online {
  background: rgba(16,232,112,.16);
  color: #10e870;
  border: 1px solid rgba(16,232,112,.5);
}

.b-active {
  background: rgba(0,229,255,.14);
  color: #7ceeff;
  border: 1px solid rgba(0,229,255,.4);
}

.b-ready {
  background: rgba(245,183,0,.15);
  color: #ffe082;
  border: 1px solid rgba(245,183,0,.45);
}

.meta {
  font-size: 11.8px;
  color: #9aa3b8;
  margin: 7px 0 9px;
  line-height: 1.7;
  word-break: break-word;
}

.prog-bg {
  width: 100%;
  height: 5px;
  border-radius: 999px;
  background: #0b0c12;
  overflow: hidden;
  margin-bottom: 10px;
  border: 1px solid #222638;
}

.prog-fill {
  height: 100%;
  border-radius: 999px;
  background: linear-gradient(90deg,#f5b700,#10e870);
}

.prog-fill.low {
  background: linear-gradient(90deg,#ff5252,#ff9100);
}

.msg {
  font-size: 12px;
  color: #10e870;
  margin-top: 2px;
  min-height: 16px;
  word-break: break-word;
}

.clean-banner {
  background: rgba(255,123,123,.12);
  border: 1px solid rgba(255,123,123,.38);
  color: #ff9e9e;
  border-radius: 12px;
  padding: 9px 12px;
  font-size: 12px;
  margin-bottom: 12px;
  display: none;
}

.empty {
  text-align: center;
  color: #8b93a7;
  font-size: 13px;
  padding: 22px 12px;
}

@media (max-width: 360px) {
  .stats { gap: 5px; }
  .stat .num { font-size: 16px; }
  .stat .lbl { font-size: 9px; }
  .row { gap: 5px; }
  .btn-sm { font-size: 10.5px; padding: 8px 5px; }
}
</style>
</head>

<body>

<div class="head">
  <div>
    <div class="head-title">پنل مدیریت VIP بلوچ پینگ</div>
    <div class="head-sub">مدیریت اشتراک‌ها • حذف خودکار منقضی‌ها</div>
  </div>
  <button id="refreshBtn" class="refresh-btn" type="button">↻ بروزرسانی</button>
</div>

<div id="cleanBanner" class="clean-banner"></div>

<div class="stats">
  <div class="stat online" data-filter="online">
    <div class="num">
      <span class="pulse"></span>
      <span id="stOnline">0</span>
    </div>
    <div class="lbl">آنلاین</div>
  </div>

  <div class="stat active" data-filter="active">
    <div id="stActive" class="num">0</div>
    <div class="lbl">فعال</div>
  </div>

  <div class="stat ready" data-filter="ready">
    <div id="stReady" class="num">0</div>
    <div class="lbl">آماده</div>
  </div>

  <div class="stat expired" id="expiredBox">
    <div id="stExpired" class="num">0</div>
    <div class="lbl">منقضی پاک‌شده</div>
  </div>
</div>

<div class="card">
  <h2>ساخت کد اشتراک VIP جدید</h2>

  <select id="days">
    <option value="30">اشتراک یک‌ماهه (۳۰ روز)</option>
    <option value="60">اشتراک دوماهه (۶۰ روز)</option>
    <option value="90">اشتراک سه‌ماهه (۹۰ روز)</option>
    <option value="7">تست هفتگی (۷ روز)</option>
  </select>

  <input id="note" maxlength="60" placeholder="یادداشت یا آیدی مشتری">

  <button id="createBtn" type="button">
    ساخت کد یکتا و کپی
  </button>

  <div id="statusMsg" class="msg"></div>
</div>

<div class="filter-bar">
  <button class="f-pill on" data-pill="all" type="button">
    همه (<span id="cntAll">0</span>)
  </button>

  <button class="f-pill" data-pill="online" type="button">آنلاین</button>
  <button class="f-pill" data-pill="active" type="button">فعال</button>
  <button class="f-pill" data-pill="ready" type="button">آماده فعال‌سازی</button>
</div>

<div class="search-wrap">
  <input
    id="searchInput"
    class="search-input"
    placeholder="جستجو با کد اشتراک یا آیدی مشتری..."
  >
  <button id="clearSearch" class="search-clear" type="button">✕</button>
</div>

<div id="list">
  <div class="card empty">در حال بارگذاری...</div>
</div>

<script>
"use strict";

const adminKey =
  new URLSearchParams(location.search).get("key") || "";

const API =
  "/v1/admin/api?key=" + encodeURIComponent(adminKey);

let allItems = [];
let serverNow = Date.now();
let onlineWindowMs = 1800000;
let expiredTotal = 0;
let activeFilter = "all";

function isOnline(item) {
  return Boolean(
    item.deviceId &&
    item.lastSeenAt &&
    serverNow - item.lastSeenAt <= onlineWindowMs
  );
}

function formatAgo(timestamp) {
  if (!timestamp) return "ثبت نشده";

  const diff = Math.max(0, serverNow - timestamp);
  const mins = Math.floor(diff / 60000);

  if (mins < 2) return "هم‌اکنون";
  if (mins < 60) return mins + " دقیقه پیش";

  const hrs = Math.floor(mins / 60);

  if (hrs < 24) return hrs + " ساعت پیش";

  return Math.floor(hrs / 24) + " روز پیش";
}

function showMessage(message, color = "#10e870") {
  const element = document.getElementById("statusMsg");
  element.textContent = message;
  element.style.color = color;
}

async function copyText(text) {
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(text);
    } else {
      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.style.position = "fixed";
      textarea.style.opacity = "0";
      document.body.appendChild(textarea);
      textarea.select();

      const copied = document.execCommand("copy");
      textarea.remove();

      if (!copied) throw new Error("COPY_FAILED");
    }

    showMessage("کد کپی شد: " + text);
  } catch {
    showMessage("کد ساخته شد؛ برای کپی دستی: " + text, "#ffe082");
  }
}

function setFilter(filter) {
  activeFilter = filter;

  document.querySelectorAll(".stat[data-filter]").forEach(element => {
    element.classList.toggle(
      "selected",
      element.dataset.filter === filter
    );
  });

  document.querySelectorAll(".f-pill").forEach(element => {
    element.classList.toggle(
      "on",
      element.dataset.pill === filter
    );
  });

  renderList();
}

function createElement(tag, className, text) {
  const element = document.createElement(tag);

  if (className) element.className = className;
  if (text !== undefined) element.textContent = text;

  return element;
}

function renderList() {
  const box = document.getElementById("list");
  const query = (
    document.getElementById("searchInput").value || ""
  ).trim().toLowerCase();

  document.getElementById("clearSearch").style.display =
    query ? "flex" : "none";

  let onlineCount = 0;
  let activeCount = 0;
  let readyCount = 0;

  allItems.forEach(item => {
    if (!item.deviceId) {
      readyCount++;
    } else {
      activeCount++;
      if (isOnline(item)) onlineCount++;
    }
  });

  document.getElementById("stOnline").textContent = onlineCount;
  document.getElementById("stActive").textContent = activeCount;
  document.getElementById("stReady").textContent = readyCount;
  document.getElementById("stExpired").textContent = expiredTotal;
  document.getElementById("cntAll").textContent = allItems.length;

  let filtered = allItems.filter(item => {
    if (activeFilter === "online" && !isOnline(item)) return false;
    if (activeFilter === "active" && !item.deviceId) return false;
    if (activeFilter === "ready" && item.deviceId) return false;

    if (!query) return true;

    const haystack = (
      (item.code || "") + " " +
      (item.note || "") + " " +
      (item.deviceId || "")
    ).toLowerCase();

    return haystack.includes(query);
  });

  if (activeFilter === "online") {
    filtered.sort((a, b) =>
      (b.lastSeenAt || 0) - (a.lastSeenAt || 0)
    );
  }

  if (!allItems.length) {
    box.innerHTML =
      '<div class="card empty">هیچ اشتراک فعالی در پنل نیست.</div>';
    return;
  }

  if (!filtered.length) {
    box.innerHTML =
      '<div class="card empty">موردی با این فیلتر یا جستجو پیدا نشد.</div>';
    return;
  }

  box.replaceChildren();

  filtered.forEach(item => {
    const online = isOnline(item);
    const card = createElement("div", "card");

    const top = createElement("div", "top-bar");
    const codeWrap = createElement("div", "code-wrap");
    const code = createElement("span", "code", item.code || "");

    const badge = createElement("span", "badge");

    if (!item.deviceId) {
      badge.classList.add("b-ready");
      badge.textContent = "آماده";
    } else if (online) {
      badge.classList.add("b-online");
      badge.appendChild(createElement("span", "pulse"));
      badge.appendChild(document.createTextNode(" آنلاین"));
    } else {
      badge.classList.add("b-active");
      badge.textContent = "فعال";
    }

    codeWrap.append(code, badge);

    const copyButton = createElement(
      "button",
      "btn-sm btn-green",
      "کپی کد"
    );

    copyButton.style.width = "auto";
    copyButton.onclick = () => copyText(item.code);

    top.append(codeWrap, copyButton);

    const meta = createElement("div", "meta");

    const remainingMs = item.expiresAtMs
      ? Math.max(0, item.expiresAtMs - serverNow)
      : 0;

    const remainingDays = Math.ceil(remainingMs / 86400000);
    const remainingHours = Math.ceil(remainingMs / 3600000);

    let timeText;

    if (!item.deviceId) {
      timeText = "آماده فعال‌سازی (" + (item.days || 30) + " روز)";
    } else if (remainingHours <= 24) {
      timeText = remainingHours + " ساعت باقی‌مانده";
    } else {
      timeText = remainingDays + " روز باقی‌مانده";
    }

    const noteText = item.note ? " | " + item.note : "";
    const seenText = item.deviceId
      ? " | آخرین اتصال: " + formatAgo(item.lastSeenAt)
      : "";

    meta.textContent = timeText + noteText + seenText;

    card.append(top, meta);

    if (item.deviceId && item.expiresAtMs) {
      const totalMs =
        (Number(item.totalDays) || Number(item.days) || 30) *
        86400000;

      const percent = Math.max(
        4,
        Math.min(100, Math.round((remainingMs / totalMs) * 100))
      );

      const progressBackground = createElement("div", "prog-bg");
      const progressFill = createElement("div", "prog-fill");

      if (remainingDays <= 3) {
        progressFill.classList.add("low");
      }

      progressFill.style.width = percent + "%";
      progressBackground.appendChild(progressFill);
      card.appendChild(progressBackground);
    }

    const row = createElement("div", "row");

    const resetButton = createElement(
      "button",
      "btn-sm btn-gray",
      "ریست گوشی"
    );

    resetButton.onclick = () => act("reset_device", item.code);

    const extendButton = createElement(
      "button",
      "btn-sm btn-gray",
      "+۳۰ روز"
    );

    extendButton.onclick = () => act("extend", item.code);

    const deleteButton = createElement(
      "button",
      "btn-sm btn-red",
      "حذف"
    );

    deleteButton.onclick = () => act("delete", item.code);

    row.append(resetButton, extendButton, deleteButton);
    card.appendChild(row);
    box.appendChild(card);
  });
}

async function load() {
  const box = document.getElementById("list");
  const refreshButton = document.getElementById("refreshBtn");

  refreshButton.disabled = true;

  try {
    const response = await fetch(API, {
      method: "GET",
      cache: "no-store"
    });

    const data = await response.json();

    if (!response.ok || !data.ok) {
      box.innerHTML =
        '<div class="card empty"></div>';

      box.firstElementChild.textContent =
        data.error || "خطا در دریافت اطلاعات";

      return;
    }

    allItems = data.items || [];
    serverNow = data.now || Date.now();
    onlineWindowMs = data.onlineWindowMs || 1800000;
    expiredTotal = data.expiredTotal || 0;

    const banner = document.getElementById("cleanBanner");

    if (data.cleanedNow > 0) {
      banner.textContent =
        data.cleanedNow +
        " اشتراک منقضی‌شده به‌صورت خودکار پاک شد.";

      banner.style.display = "block";
    } else {
      banner.style.display = "none";
    }

    renderList();
  } catch (error) {
    box.innerHTML =
      '<div class="card empty">خطا در ارتباط با سرور</div>';
  } finally {
    refreshButton.disabled = false;
  }
}

async function createCode() {
  const button = document.getElementById("createBtn");

  button.disabled = true;
  button.textContent = "در حال ساخت...";

  try {
    const days = document.getElementById("days").value;
    const note = document.getElementById("note").value.trim();

    const response = await fetch(API, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        action: "create",
        days,
        note
      })
    });

    const data = await response.json();

    if (!response.ok || !data.ok) {
      alert("خطا: " + (data.error || "نامشخص"));
      return;
    }

    document.getElementById("note").value = "";

    await copyText(data.item.code);
    await load();
  } catch {
    alert("خطا در ارتباط با سرور");
  } finally {
    button.disabled = false;
    button.textContent = "ساخت کد یکتا و کپی";
  }
}

async function act(action, code) {
  if (
    action === "delete" &&
    !confirm(
      "کد " + code +
      " حذف شود؟ این کد دیگر قابل استفاده نخواهد بود."
    )
  ) {
    return;
  }

  try {
    const response = await fetch(API, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        action,
        code
      })
    });

    const data = await response.json();

    if (!response.ok || !data.ok) {
      alert(data.error || "عملیات انجام نشد");
      return;
    }

    await load();
  } catch {
    alert("خطا در ارتباط با سرور");
  }
}

document.querySelectorAll(".stat[data-filter]").forEach(element => {
  element.addEventListener("click", () => {
    setFilter(element.dataset.filter);
  });
});

document.querySelectorAll(".f-pill").forEach(element => {
  element.addEventListener("click", () => {
    setFilter(element.dataset.pill);
  });
});

document.getElementById("expiredBox").addEventListener("click", () => {
  alert(
    "تاکنون " + expiredTotal +
    " اشتراک منقضی‌شده به‌صورت خودکار پاک شده است."
  );
});

document.getElementById("searchInput").addEventListener(
  "input",
  renderList
);

document.getElementById("clearSearch").addEventListener("click", () => {
  document.getElementById("searchInput").value = "";
  renderList();
});

document.getElementById("refreshBtn").addEventListener("click", load);
document.getElementById("createBtn").addEventListener("click", createCode);

load();
</script>

</body>
</html>
